name: Godot Headless Tests

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.6.2-stable
  GODOT_ARCHIVE: Godot_v4.6.2-stable_linux.x86_64.zip
  GODOT_EXE: Godot_v4.6.2-stable_linux.x86_64
  GODOT_BINARY: godot_headless

jobs:
  validate:
    name: Validate project load
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore cached Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_BINARY }}
          key: ${{ runner.os }}-godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_ARCHIVE }}
      - name: Download Godot headless
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          curl -sL "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/${{ env.GODOT_ARCHIVE }}" -o godot.zip
          unzip godot.zip
          mv ${{ env.GODOT_EXE }} ${{ env.GODOT_BINARY }}
          chmod +x ${{ env.GODOT_BINARY }}
      - name: Make Godot executable (cached)
        if: steps.cache-godot.outputs.cache-hit == 'true'
        run: chmod +x ${{ env.GODOT_BINARY }}
      - name: Validate project.godot loads
        run: |
          set -o pipefail
          ./${{ env.GODOT_BINARY }} --headless --audio-driver Dummy --path . --quit 2>&1 | tee validate.log
      - name: Upload validate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-log
          path: validate.log

  test:
    name: ${{ matrix.label }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: SmokeTest
            script: SmokeTestRunner.gd
            checks: 218
          - label: StartMenu
            script: StartMenuSceneTestRunner.gd
            checks: 55
          - label: GameHUD
            script: GameHUDSceneTestRunner.gd
            checks: 40
          - label: EventRoulette
            script: EventRouletteSceneTestRunner.gd
            checks: 14
          - label: SettingsPanel
            script: SettingsPanelSceneTestRunner.gd
            checks: 9
          - label: GameStateCoordinator
            script: GameStateCoordinatorTestRunner.gd
            checks: 50
          - label: SaveFlow
            script: SaveFlowControllerTestRunner.gd
            checks: 190
          - label: RestorePlan
            script: RestorePlanTestRunner.gd
            checks: 11
          - label: Integration
            script: IntegrationTestRunner.gd
            checks: 133
          - label: LayoutSanity
            script: LayoutSanityTestRunner.gd
            checks: 376
    steps:
      - uses: actions/checkout@v4
      - name: Restore cached Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_BINARY }}
          key: ${{ runner.os }}-godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_ARCHIVE }}
      - name: Download Godot headless
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          curl -sL "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/${{ env.GODOT_ARCHIVE }}" -o godot.zip
          unzip godot.zip
          mv ${{ env.GODOT_EXE }} ${{ env.GODOT_BINARY }}
          chmod +x ${{ env.GODOT_BINARY }}
      - name: Make Godot executable (cached)
        if: steps.cache-godot.outputs.cache-hit == 'true'
        run: chmod +x ${{ env.GODOT_BINARY }}
      - name: Import project
        run: |
          set -o pipefail
          ./${{ env.GODOT_BINARY }} --headless --audio-driver Dummy --editor --path . --quit 2>&1 | tee import.log
      - name: Run ${{ matrix.label }}
        run: |
          set -o pipefail
          ./${{ env.GODOT_BINARY }} --headless --audio-driver Dummy --path . --script res://scripts/tests/${{ matrix.script }} 2>&1 | tee test_output.log
          tail -5 test_output.log
      - name: Check test result
        run: |
          if grep -q "FAIL" test_output.log; then
            echo "::error::${{ matrix.label }} printed a FAIL marker"
            exit 1
          elif grep -q "PASS" test_output.log; then
            echo "${{ matrix.label }} printed a PASS marker"
          else
            echo "${{ matrix.label }} completed successfully; relying on the Godot exit code"
          fi
      - name: Upload ${{ matrix.label }} log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.label }}
          path: |
            import.log
            test_output.log
